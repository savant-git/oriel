<html><head>
<title>Savant Web Chat</title>
<style>
body{background:#1b1b1b;color:#e5e5e5;font-family:'Inter',sans-serif;margin:0;padding:0}
.header{background:#2b2b2b;padding:1rem;text-align:center;font-size:1.5rem;color:#FFD700;border-bottom:1px solid #333}
.chatbox{display:flex;flex-direction:column;height:90vh;overflow-y:auto;padding:1rem}
.msg{margin:0.5rem 0;line-height:1.4}.user{color:#FFD700}.bot{color:#c4c4c4}
form{position:fixed;bottom:0;width:100%;background:#2b2b2b;padding:1rem}
input{width:80%;padding:0.5rem;border-radius:4px;border:none}
button{background:#FFD700;color:#1b1b1b;border:none;padding:0.5rem 1rem;margin-left:0.5rem;border-radius:4px;cursor:pointer;font-weight:bold}
</style></head>
<body>
<div class="header">🧠 Savant Web Chat</div>
<div id="chatbox" class="chatbox"></div>
<form id="chatForm">
<input type="text" id="userInput" placeholder="Type your message..." autofocus required/>
<button type="submit">Send</button>
</form>
<script>
const form=document.getElementById('chatForm');
const input=document.getElementById('userInput');
const chatbox=document.getElementById('chatbox');
form.addEventListener('submit',async(e)=>{
 e.preventDefault();
 const text=input.value.trim();
 if(!text)return;
 chatbox.innerHTML+=`<div class="msg user">🧠 You: ${text}</div>`;
 input.value='';
 const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
 const d=await r.json();
 chatbox.innerHTML+=`<div class="msg bot">🤖 Savant: ${d.reply}</div>`;
 chatbox.scrollTop=chatbox.scrollHeight;
});
</script></body></html>
