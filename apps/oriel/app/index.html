<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oriel Desktop</title>
    <style>
      body {
        margin: 0;
        padding: 2rem;
        background: #0f0f0f;
        color: #e0e0e0;
        font-family: "Inter", "Segoe UI", sans-serif;
      }

      h1 {
        margin-top: 0;
        font-size: 1.8rem;
        letter-spacing: 1px;
      }

      #updates {
        background: #1c1c1c;
        padding: 1rem;
        border-radius: 0.5rem;
        font-family: monospace;
        white-space: pre-wrap;
        height: 200px;
        overflow-y: auto;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.05) inset;
      }

      footer {
        margin-top: 2rem;
        font-size: 0.8rem;
        opacity: 0.6;
      }
    </style>
  </head>

  <body>
    <h1>🜹 Oriel System Interface</h1>

    <div id="updates">Initializing auto-updater…</div>

    <footer>
      Oriel © 2025 &nbsp; | &nbsp; Savant System Simulation Environment
    </footer>

    <script>
      // Attach to OrielAPI from preload
      if (window.OrielAPI && window.OrielAPI.onUpdateMessage) {
        window.OrielAPI.onUpdateMessage((msg) => {
          const box = document.getElementById("updates");
          box.textContent = msg;
          box.scrollTop = box.scrollHeight; // auto-scroll to bottom
        });
      } else {
        document.getElementById("updates").textContent =
          "OrielAPI bridge not detected.";
      }
    </script>
  </body>
</html>
